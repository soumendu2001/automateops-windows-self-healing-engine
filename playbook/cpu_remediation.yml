---
- name: Windows CPU Remediation
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    cpu_threshold: "{{ desired_cpu_usage | default(85) }}"

  tasks:
    - name: Skip CPU remediation if not required
      meta: end_play
      when:
        - not (run_cpu_fix | default(false))

    ############################################################
    # PRE-CHECK
    ############################################################

    - name: Get CPU utilization
      ansible.windows.win_shell: |
        try {
          $cpu = Get-CimInstance Win32_Processor |
            Measure-Object -Property LoadPercentage -Average

          [math]::Round($cpu.Average,0)
        }
        catch {
          Write-Output "0"
        }
      register: cpu_before

    - name: Set CPU fact
      set_fact:
        current_cpu_usage: "{{ cpu_before.stdout | trim | int }}"

    - name: Display CPU utilization
      debug:
        msg: "Current CPU Usage: {{ current_cpu_usage }}%"

    ############################################################
    # HEALTHY CPU PATH
    ############################################################

    - name: Export healthy CPU status
      set_stats:
        aggregate: true
        data:
          cpu_usage_after: "{{ current_cpu_usage }}"
      when:
        - current_cpu_usage | int < cpu_threshold | int

    - name: Exit if CPU healthy
      meta: end_play
      when:
        - current_cpu_usage | int < cpu_threshold | int

    ############################################################
    # REMEDIATION
    ############################################################

    - name: Remediation required
      debug:
        msg:
          - "CPU threshold exceeded"
          - "Starting CPU remediation"

    - name: Stop high CPU powershell processes
      ansible.windows.win_shell: |
        Get-Process powershell -ErrorAction SilentlyContinue |
        Where-Object { $_.Id -ne $PID } |
        Stop-Process -Force -ErrorAction SilentlyContinue
      ignore_errors: true

    - name: Wait for stabilization
      pause:
        seconds: 15

    ############################################################
    # VALIDATION
    ############################################################

    - name: Recheck CPU utilization
      ansible.windows.win_shell: |
        try {
          $cpu = Get-CimInstance Win32_Processor |
            Measure-Object -Property LoadPercentage -Average

          [math]::Round($cpu.Average,0)
        }
        catch {
          Write-Output "0"
        }
      register: cpu_after

    - name: Set CPU usage after fact
      set_fact:
        cpu_usage_after: "{{ cpu_after.stdout | trim | int }}"

    - name: Display CPU results
      debug:
        msg:
          - "CPU Before : {{ current_cpu_usage }}%"
          - "CPU After  : {{ cpu_usage_after }}%"

    ############################################################
    # EXPORT RESULTS
    ############################################################

    - name: Export CPU results
      set_stats:
        aggregate: true
        data:
          cpu_usage_after: "{{ cpu_usage_after }}"
