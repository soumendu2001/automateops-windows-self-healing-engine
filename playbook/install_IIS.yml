---
- name: Install IIS
  hosts: "{{ target_host }}"
  gather_facts: false

  tasks:

    - name: Install IIS
      ansible.windows.win_feature:
        name:
          - Web-Server
        include_management_tools: true
        state: present

    - name: Ensure IIS service is running
      ansible.windows.win_service:
        name: W3SVC
        state: started
