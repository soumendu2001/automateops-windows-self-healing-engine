---
- name: Initialize Runtime Variables
  set_fact:
    current_memory: "{{ memory_before.stdout | float }}"
    remediation_complete: false

- name: Remediation Attempt 1
  include_tasks: memory_remediation_attempt.yml
  vars:
    attempt_no: 1
  when:
    - not remediation_complete
    - (current_memory | float) > (memory_threshold | float)

- name: Remediation Attempt 2
  include_tasks: memory_remediation_attempt.yml
  vars:
    attempt_no: 2
  when:
    - not remediation_complete
    - (current_memory | float) > (memory_threshold | float)

- name: Remediation Attempt 3
  include_tasks: memory_remediation_attempt.yml
  vars:
    attempt_no: 3
  when:
    - not remediation_complete
    - (current_memory | float) > (memory_threshold | float)

