---
- name: Windows Health Check
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    disk_threshold: "{{ desired_disk_usage | default(90) }}"
    memory_threshold: "{{ desired_memory_usage | default(50) }}"
    cpu_threshold: "{{ desired_cpu_usage | default(85) }}"

  tasks:

    #####################################################
    # SERVICE VALIDATION
    #####################################################

    - name: Initialize failed services
      set_fact:
        failed_services: []

    - name: Check service status
      ansible.windows.win_shell: |
        (Get-Service -Name "{{ item.name }}").Status
      loop: "{{ services | default([]) }}"
      when:
        - item.validation_type == "service"
      register: service_checks

    - name: Validate ports
      ansible.windows.win_shell: |
        try {
            $result = Test-NetConnection `
                -ComputerName localhost `
                -Port {{ item.validation_port }} `
                -InformationLevel Quiet

            if ($result) {
                Write-Output "OPEN"
            }
            else {
                Write-Output "CLOSED"
            }
        }
        catch {
            Write-Output "CLOSED"
        }
      loop: "{{ services | default([]) }}"
      when:
        - item.validation_type == "port"
      register: port_checks

    - name: Show service status
      debug:
        msg: "{{ item.item.name }} : {{ item.stdout | trim }}"
      loop: "{{ service_checks.results | default([]) }}"
      when:
        - item.stdout is defined

    - name: Build failed services list
      set_fact:
        failed_services: "{{ failed_services + [ item.item.name ] }}"
      loop: "{{ service_checks.results | default([]) }}"
      when:
        - item.stdout is defined
        - item.stdout | trim != "Running"

    - name: Add failed port validations
      set_fact:
        failed_services: "{{ failed_services + [ item.item.name ] }}"
      loop: "{{ port_checks.results | default([]) }}"
      when:
        - item.stdout is defined
        - item.stdout | trim != "OPEN"

    - name: Set service remediation flag
      set_fact:
        run_service_fix: "{{ failed_services | length > 0 }}"

    #####################################################
    # DISK UTILIZATION CHECK
    #####################################################

    - name: Get disk utilization
      ansible.windows.win_shell: |
        $disk = Get-CimInstance Win32_LogicalDisk `
        -Filter "DeviceID='{{ drive_letter | default('C') }}:'"

        [math]::Round(
          (($disk.Size - $disk.FreeSpace) / $disk.Size) * 100,
          0
        )
      register: disk_usage_raw

    - name: Set disk usage fact
      set_fact:
        disk_usage: "{{ disk_usage_raw.stdout | trim | int }}"

    - name: Set disk remediation flag
      set_fact:
        run_disk_fix: "{{ disk_usage | int >= disk_threshold | int }}"

    #####################################################
    # MEMORY UTILIZATION CHECK
    #####################################################

    - name: Get memory utilization
      ansible.windows.win_shell: |
        $os = Get-CimInstance Win32_OperatingSystem

        $used =
        (($os.TotalVisibleMemorySize -
          $os.FreePhysicalMemory) /
          $os.TotalVisibleMemorySize) * 100

        [math]::Round($used,0)
      register: memory_usage_raw

    - name: Set memory usage fact
      set_fact:
        memory_usage: "{{ memory_usage_raw.stdout | trim | int }}"

    - name: Set memory remediation flag
      set_fact:
        run_memory_fix: "{{ memory_usage | int >= memory_threshold | int }}"

    #####################################################
    # CPU UTILIZATION CHECK
    #####################################################

    - name: Get CPU utilization
      ansible.windows.win_shell: |
        $sample1 = (
          Get-Counter '\Processor(_Total)\% Processor Time'
        ).CounterSamples.CookedValue

        Start-Sleep -Seconds 2

        $sample2 = (
          Get-Counter '\Processor(_Total)\% Processor Time'
        ).CounterSamples.CookedValue

        [math]::Round(($sample1 + $sample2) / 2, 0)
      register: cpu_usage_raw

    - name: Set CPU usage fact
      set_fact:
        cpu_usage: "{{ cpu_usage_raw.stdout | trim | int }}"

    - name: Set CPU remediation flag
      set_fact:
        run_cpu_fix: "{{ cpu_usage | int >= cpu_threshold | int }}"

    #####################################################
    # HEALTH SUMMARY
    #####################################################

    - name: Display health assessment
      debug:
        msg:
          - "========== WINDOWS HEALTH REPORT =========="
          - "Server              : {{ inventory_hostname }}"
          - "CPU Usage           : {{ cpu_usage }}%"
          - "Memory Usage        : {{ memory_usage }}%"
          - "Disk Usage          : {{ disk_usage }}%"
          - "Failed Services     : {{ failed_services }}"
          - "------------------------------------------"
          - "CPU Remediation     : {{ run_cpu_fix }}"
          - "Memory Remediation  : {{ run_memory_fix }}"
          - "Disk Remediation    : {{ run_disk_fix }}"
          - "Service Remediation : {{ run_service_fix }}"
          - "=========================================="

    #####################################################
    # EXPORT VARIABLES TO AWX WORKFLOW
    #####################################################

    - name: Export workflow variables
      ansible.builtin.set_stats:
        aggregate: true
        data:
          run_service_fix: "{{ run_service_fix }}"
          run_disk_fix: "{{ run_disk_fix }}"
          run_memory_fix: "{{ run_memory_fix }}"
          run_cpu_fix: "{{ run_cpu_fix }}"

          failed_services: "{{ failed_services }}"

          disk_usage_before: "{{ disk_usage }}"
          memory_usage_before: "{{ memory_usage }}"
          cpu_usage_before: "{{ cpu_usage }}"
