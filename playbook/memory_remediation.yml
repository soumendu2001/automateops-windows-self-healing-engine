---
- name: Windows Memory Remediation
  hosts: "{{ target_host }}"
  gather_facts: false

  vars:
    memory_threshold: "{{ desired_memory_usage | default(90) }}"
    process_memory_threshold_mb: 100

  tasks:

    #####################################################
    # PRE-CHECK
    #####################################################

    - name: Get current memory utilization
      ansible.windows.win_shell: |
        $os = Get-CimInstance Win32_OperatingSystem

        $used =
        (($os.TotalVisibleMemorySize -
          $os.FreePhysicalMemory) /
          $os.TotalVisibleMemorySize) * 100

        [math]::Round($used,0)
      register: memory_before

    - set_fact:
        current_memory: "{{ memory_before.stdout | trim | float }}"

    - debug:
        msg: "Current Memory Usage: {{ current_memory }}%"

    - meta: end_play
      when:
        - current_memory <= memory_threshold | float

    #####################################################
    # MAIN REMEDIATION ENGINE
    #####################################################

    - include_tasks: memory_remediate.yml
