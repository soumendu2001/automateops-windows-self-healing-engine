---
- name: Generate Self-Healing Report
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Calculate self-healing result
      set_fact:
        self_healing_success: >-
          {{
            (service_healthy | default(true))
            and
            (
              (disk_usage_after | default(disk_usage_before | default(0)) | int)
              <=
              (desired_disk_usage | default(90) | int)
            )
            and
            (
              (memory_usage_after | default(memory_usage_before | default(0)) | int)
              <=
              (desired_memory_usage | default(90) | int)
            )
            and
            (
              (cpu_usage_after | default(cpu_usage_before | default(0)) | int)
              <=
              (desired_cpu_usage | default(85) | int)
            )
          }}

    - name: Create report file
      copy:
        dest: /tmp/self_healing_report.txt
        content: |
          ======================================================
               WINDOWS AUTONOMOUS SELF-HEALING REPORT
          ======================================================

          SERVER
          ------------------------------------------------------
          {{ target_host | default('Unknown') }}

          ISSUES DETECTED
          ------------------------------------------------------
          Service Recovery Required : {{ run_service_fix | default(false) }}
          Disk Cleanup Required     : {{ run_disk_fix | default(false) }}
          Memory Cleanup Required   : {{ run_memory_fix | default(false) }}
          CPU Cleanup Required      : {{ run_cpu_fix | default(false) }}

          POST-REMEDIATION STATE
          ------------------------------------------------------
          Service Healthy : {{ service_healthy | default('Unknown') }}
          Disk Usage      : {{ disk_usage_after | default('N/A') }}%
          Memory Usage    : {{ memory_usage_after | default('N/A') }}%
          CPU Usage       : {{ cpu_usage_after | default('N/A') }}%

          TARGET THRESHOLDS
          ------------------------------------------------------
          Disk Threshold   : {{ desired_disk_usage | default(90) }}%
          Memory Threshold : {{ desired_memory_usage | default(90) }}%
          CPU Threshold    : {{ desired_cpu_usage | default(85) }}%

          AUTOMATION SUMMARY
          ------------------------------------------------------
          Human Intervention : 0
          Autonomous Recovery: ENABLED

          FINAL RESULT
          ------------------------------------------------------
          {{ 'SUCCESS' if self_healing_success else 'FAILED' }}

          ======================================================

    - name: Read report file
      command: cat /tmp/self_healing_report.txt
      register: report_output
      changed_when: false

    - name: Show final report
      debug:
        msg: "{{ report_output.stdout_lines }}"
