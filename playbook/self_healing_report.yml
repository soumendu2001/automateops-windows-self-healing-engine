---
- name: Generate Self-Healing Report
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Build Report
      debug:
        msg:
          - ""
          - "==============================================="
          - " WINDOWS AUTONOMOUS SELF-HEALING REPORT "
          - "==============================================="
          - "Server: {{ target_host | default('Unknown') }}"
          - ""
          - "ISSUES DETECTED"
          - ""
          - "Service Remediation Required : {{ run_service_fix | default(false) }}"
          - "Disk Remediation Required    : {{ run_disk_fix | default(false) }}"
          - "Memory Remediation Required  : {{ run_memory_fix | default(false) }}"
          - "CPU Remediation Required     : {{ run_cpu_fix | default(false) }}"
          - ""
          - "FINAL STATE"
          - ""
          - "Service Healthy : {{ service_healthy | default('Unknown') }}"
          - "Disk Usage      : {{ disk_usage_after | default(disk_usage_before | default('N/A')) }}%"
          - "Memory Usage    : {{ memory_usage_after | default(memory_usage_before | default('N/A')) }}%"
          - "CPU Usage       : {{ cpu_usage_after | default(cpu_usage_before | default('N/A')) }}%"
          - ""
          - "AUTOMATION RESULT"
          - ""
          - "Human Intervention : 0"
          - "Self-Healing Status: {{ self_healing_success | default(false) }}"
          - ""
          - "==============================================="
