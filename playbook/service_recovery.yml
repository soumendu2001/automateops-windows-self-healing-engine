---
- name: Windows Service Recovery
  hosts: "{{ target_host }}"
  gather_facts: false

  tasks:

    ############################################################
    # PRE-CHECK
    ############################################################

    - name: Initialize failed services list
      set_fact:
        failed_services: []

    - name: Check service status
      ansible.windows.win_shell: |
        (Get-Service -Name "{{ item.name }}").Status
      loop: "{{ services | default([]) }}"
      when:
        - item.validation_type == "service"
      register: service_checks

    - name: Display service status
      debug:
        msg: "{{ item.item.name }} : {{ item.stdout | trim }}"
      loop: "{{ service_checks.results | default([]) }}"
      when:
        - item.stdout is defined

    - name: Build failed services list
      set_fact:
        failed_services: "{{ failed_services + [ item.item.name ] }}"
      loop: "{{ service_checks.results | default([]) }}"
      when:
        - item.stdout is defined
        - item.stdout | trim != "Running"

    - name: Export healthy service status
      set_stats:
        aggregate: true
        data:
          service_healthy: true
      when:
        - failed_services | length == 0

    - name: Exit if all services healthy
      meta: end_play
      when:
        - failed_services | length == 0

    ############################################################
    # REMEDIATION
    ############################################################

    - name: Display failed services
      debug:
        msg:
          - "Failed Services: {{ failed_services }}"
          - "Initiating recovery"

    - name: Start failed services
      ansible.windows.win_service:
        name: "{{ item }}"
        state: started
      loop: "{{ failed_services }}"
      register: recovery_results

    ############################################################
    # VALIDATION
    ############################################################

    - name: Validate recovered services
      ansible.windows.win_shell: |
        (Get-Service -Name "{{ item }}").Status
      loop: "{{ failed_services }}"
      register: validation_results

    - name: Show validation results
      debug:
        msg: "{{ item.item }} : {{ item.stdout | trim }}"
      loop: "{{ validation_results.results }}"

    - name: Determine service health
      set_fact:
        service_healthy: >-
          {{
            validation_results.results
            | map(attribute='stdout')
            | map('trim')
            | unique
            | list
            == ['Running']
          }}

    ############################################################
    # EXPORT RESULTS
    ############################################################

    - name: Export service results
      set_stats:
        aggregate: true
        data:
          service_healthy: "{{ service_healthy }}"
